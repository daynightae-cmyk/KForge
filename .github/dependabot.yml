version: 2

updates:
  # ============================================================
  # KNOuX Forge — npm dependencies
  # Weekly routine maintenance is intentionally limited to
  # minor/patch version updates. Breaking majors are handled by
  # one-at-a-time migration missions after explicit review.
  #
  # IMPORTANT: GitHub documents update-types ignores as applying
  # to version updates; Dependabot security updates remain enabled.
  # ============================================================
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"

    open-pull-requests-limit: 10

    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    labels:
      - "dependencies"

  # ============================================================
  # KNOuX Forge — GitHub Actions
  # Keeps pinned Action SHAs current through reviewed PRs.
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Dubai"

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(ci)"

    labels:
      - "dependencies"
      - "github-actions"
