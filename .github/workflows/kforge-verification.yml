name: KForge Verification Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kforge-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · marketplace · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        id: npm_ci
        continue-on-error: true
        run: npm ci

      - name: Typecheck
        id: typecheck
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Marketplace lifecycle acceptance
        id: marketplace
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npx vitest --run server/services/marketplace.spec.ts server/routes/marketplaceLifecycle.spec.ts

      - name: Unit and service tests
        id: tests
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run test

      - name: Production build
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Install Playwright browser
        id: playwright_browser
        if: steps.npm_ci.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Production E2E
        id: e2e
        if: steps.npm_ci.outcome == 'success' && steps.build.outcome == 'success' && steps.playwright_browser.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e

      - name: Aggregate local verification gate
        id: verify_gate
        if: steps.npm_ci.outcome == 'success' && steps.e2e.outcome == 'success'
        continue-on-error: true
        run: npm run verify:gate

      - name: Create verification evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NPM_CI: ${{ steps.npm_ci.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT_BROWSER: ${{ steps.playwright_browser.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          VERIFY_GATE: ${{ steps.verify_gate.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const required = ['NPM_CI', 'TYPECHECK', 'LINT', 'MARKETPLACE', 'TESTS', 'BUILD', 'PLAYWRIGHT_BROWSER', 'E2E', 'VERIFY_GATE'];
          const steps = Object.fromEntries(required.map((name) => [name.toLowerCase(), process.env[name] || 'skipped']));
          const pass = required.every((name) => process.env[name] === 'success');
          const evidence = {
            schemaVersion: 3,
            workflow: 'KForge Verification Gate',
            testedSha: process.env.TESTED_SHA,
            githubSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            event: process.env.GITHUB_EVENT_NAME,
            runner: process.env.RUNNER_OS,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            recordedAt: new Date().toISOString(),
            steps,
            gate: pass ? 'PASS' : 'FAIL',
          };
          writeFileSync('verification-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kforge-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verification gate
        if: always()
        env:
          NPM_CI: ${{ steps.npm_ci.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT_BROWSER: ${{ steps.playwright_browser.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          VERIFY_GATE: ${{ steps.verify_gate.outcome }}
        run: |
          printf '%s\n' \
            "npm_ci=${NPM_CI}" \
            "typecheck=${TYPECHECK}" \
            "lint=${LINT}" \
            "marketplace=${MARKETPLACE}" \
            "tests=${TESTS}" \
            "build=${BUILD}" \
            "playwright_browser=${PLAYWRIGHT_BROWSER}" \
            "e2e=${E2E}" \
            "verify_gate=${VERIFY_GATE}"
          test "${NPM_CI}" = success
          test "${TYPECHECK}" = success
          test "${LINT}" = success
          test "${MARKETPLACE}" = success
          test "${TESTS}" = success
          test "${BUILD}" = success
          test "${PLAYWRIGHT_BROWSER}" = success
          test "${E2E}" = success
          test "${VERIFY_GATE}" = success
