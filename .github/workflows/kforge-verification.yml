name: KForge Verification Gate

on:
  push:
    branches:
      - main
      - 'traycer/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kforge-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint / formatting gate
        run: npm run lint

      - name: Unit and service tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production E2E
        run: npm run test:e2e
