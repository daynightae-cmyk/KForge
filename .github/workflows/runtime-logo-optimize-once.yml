name: One-shot runtime logo optimization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-logo-optimize-once.yml

permissions:
  contents: write

jobs:
  optimize-runtime-logo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y webp imagemagick

      - name: Prove current logo topology and create lossless runtime asset
        shell: bash
        run: |
          set -euo pipefail
          master='client/assets/knoux-forge-official-logo.png'
          runtime='client/assets/knoux-forge-official-logo.webp'

          test -f "$master"
          test ! -e "$runtime"

          echo 'Current textual references:'
          grep -RIn --exclude-dir=.git --exclude='package-lock.json' 'knoux-forge-official-logo.png' . || true

          client_refs=$(grep -RIl --include='*.ts' --include='*.tsx' --include='*.css' --include='*.html' 'knoux-forge-official-logo.png' client || true)
          test "$client_refs" = 'client/pages/KnouxForgeInstallation.tsx'

          master_bytes=$(stat -c%s "$master")
          master_geometry=$(identify -format '%wx%h' "$master")
          master_channels=$(identify -format '%[channels]' "$master")
          echo "master bytes=$master_bytes geometry=$master_geometry channels=$master_channels"

          cwebp -quiet -lossless -q 100 -m 6 -exact -metadata icc "$master" -o "$runtime"

          runtime_bytes=$(stat -c%s "$runtime")
          runtime_geometry=$(identify -format '%wx%h' "$runtime")
          runtime_channels=$(identify -format '%[channels]' "$runtime")
          echo "runtime bytes=$runtime_bytes geometry=$runtime_geometry channels=$runtime_channels"

          test "$runtime_geometry" = "$master_geometry"

          set +e
          pixel_diff=$(compare -metric AE "$master" "$runtime" null: 2>&1)
          compare_exit=$?
          set -e
          echo "pixel absolute-error count=$pixel_diff compare_exit=$compare_exit"
          test "$pixel_diff" = '0'

          python3 - "$master_bytes" "$runtime_bytes" <<'PY'
          import sys
          master = int(sys.argv[1])
          runtime = int(sys.argv[2])
          ratio = runtime / master
          saved = master - runtime
          print(f'compression ratio={ratio:.4f}; saved={saved} bytes ({(1-ratio)*100:.2f}%)')
          if runtime > 700_000:
              raise SystemExit(f'lossless WebP exceeds 700000-byte runtime budget: {runtime}')
          if ratio >= 0.70:
              raise SystemExit(f'lossless WebP reduction is not material enough: ratio={ratio:.4f}')
          PY

      - name: Switch browser runtime to WebP and harden asset budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('client/pages/KnouxForgeInstallation.tsx')
          text = page.read_text()
          old = '../assets/knoux-forge-official-logo.png'
          new = '../assets/knoux-forge-official-logo.webp'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one browser master-logo import, found {text.count(old)}')
          page.write_text(text.replace(old, new))

          budget = Path('scripts/verify-asset-budget.mjs')
          text = budget.read_text()
          text = text.replace(
              'const logoPath = path.join(root, "client", "assets", "knoux-forge-official-logo.png");\nconst retiredReferencePath',
              'const logoPath = path.join(root, "client", "assets", "knoux-forge-official-logo.png");\nconst runtimeLogoPath = path.join(root, "client", "assets", "knoux-forge-official-logo.webp");\nconst retiredReferencePath',
              1,
          )
          text = text.replace(
              'const logoBudgetBytes = 1_050_000;\nconst revealAudioPath',
              'const logoBudgetBytes = 1_050_000;\nconst runtimeLogoBudgetBytes = 700_000;\nconst webpRiffSignature = Buffer.from("RIFF", "ascii");\nconst webpFormatSignature = Buffer.from("WEBP", "ascii");\nconst revealAudioPath',
              1,
          )
          marker = 'const logo = await fs.readFile(logoPath);\n'
          insertion = '''const runtimeLogo = await fs.readFile(runtimeLogoPath);\nif (runtimeLogo.length > runtimeLogoBudgetBytes) {\n  console.error("KForge asset budget verification: FAIL");\n  console.error(`Runtime logo is ${runtimeLogo.length} bytes; budget is ${runtimeLogoBudgetBytes} bytes.`);\n  process.exit(1);\n}\n\nif (!runtimeLogo.subarray(0, webpRiffSignature.length).equals(webpRiffSignature) || !runtimeLogo.subarray(8, 12).equals(webpFormatSignature)) {\n  console.error("KForge asset budget verification: FAIL");\n  console.error("Runtime logo no longer has a valid WebP RIFF signature.");\n  process.exit(1);\n}\n\n'''
          if marker not in text:
              raise SystemExit('logo verification marker not found')
          text = text.replace(marker, insertion + marker, 1)

          old_install = 'if (!installationSource.includes("/audio/logo-reveal-slow.ogg") || installationSource.includes("/audio/logo-reveal-slow.wav")) {'
          new_install = 'if (!installationSource.includes("/audio/logo-reveal-slow.ogg") || installationSource.includes("/audio/logo-reveal-slow.wav") || !installationSource.includes("knoux-forge-official-logo.webp") || installationSource.includes("knoux-forge-official-logo.png")) {'
          if old_install not in text:
              raise SystemExit('installation source invariant marker not found')
          text = text.replace(old_install, new_install, 1)

          old_message = 'console.error("Installation runtime must reference only the compact Opus reveal asset.");'
          new_message = 'console.error("Installation runtime must reference only compact Opus audio and the lossless WebP runtime logo.");'
          if old_message not in text:
              raise SystemExit('installation invariant message marker not found')
          text = text.replace(old_message, new_message, 1)

          old_log = 'console.log(`KForge asset budget verification: PASS (official logo ${logo.length}/${logoBudgetBytes} bytes; reveal audio ${revealAudio.length}/${revealAudioBudgetBytes} bytes; retired reference/WAV absent).`);'
          new_log = 'console.log(`KForge asset budget verification: PASS (master logo ${logo.length}/${logoBudgetBytes} bytes; runtime logo ${runtimeLogo.length}/${runtimeLogoBudgetBytes} bytes; reveal audio ${revealAudio.length}/${revealAudioBudgetBytes} bytes; retired reference/WAV absent).`);'
          if old_log not in text:
              raise SystemExit('asset budget PASS log marker not found')
          budget.write_text(text.replace(old_log, new_log, 1))
          PY

          cat > tests/e2e/installation-logo-evidence.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          test("KForge startup reveal uses the compact lossless WebP runtime logo", async ({ page }) => {
            await page.goto("/", { waitUntil: "domcontentloaded" });

            const logo = page.getByRole("img", { name: "Knoux Forge official logo" });
            await expect(logo).toBeVisible();

            const decoded = await logo.evaluate(async (element) => {
              const image = element as HTMLImageElement;
              await image.decode();
              const response = await fetch(image.currentSrc, { cache: "no-store" });
              if (!response.ok) throw new Error(`Runtime logo request failed with ${response.status}`);
              const bytes = await response.arrayBuffer();
              return {
                src: image.currentSrc,
                bytes: bytes.byteLength,
                contentType: response.headers.get("content-type"),
                width: image.naturalWidth,
                height: image.naturalHeight,
              };
            });

            expect(new URL(decoded.src).pathname).toMatch(/knoux-forge-official-logo-.*\.webp$/);
            expect(decoded.bytes).toBeGreaterThan(0);
            expect(decoded.bytes).toBeLessThanOrEqual(700_000);
            expect(decoded.contentType).toContain("image/webp");
            expect(decoded.width).toBeGreaterThan(0);
            expect(decoded.height).toBeGreaterThan(0);
          });
          EOF

      - name: Validate exact optimization diff
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            'client/assets/knoux-forge-official-logo.webp' \
            'client/pages/KnouxForgeInstallation.tsx' \
            'scripts/verify-asset-budget.mjs' \
            'tests/e2e/installation-logo-evidence.spec.ts' | sort)
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected runtime-logo diff; refusing commit.' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Verify optimized logo path before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:assets
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/installation-logo-evidence.spec.ts tests/e2e/installation-audio-evidence.spec.ts

          test "$(find dist/spa/assets -maxdepth 1 -type f -name 'knoux-forge-official-logo-*.webp' | wc -l)" -eq 1
          test "$(find dist/spa/assets -maxdepth 1 -type f -name 'knoux-forge-official-logo-*.png' | wc -l)" -eq 0

      - name: Commit verified runtime logo optimization to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/assets/knoux-forge-official-logo.webp \
            client/pages/KnouxForgeInstallation.tsx \
            scripts/verify-asset-budget.mjs \
            tests/e2e/installation-logo-evidence.spec.ts
          git commit -m 'perf(startup): use pixel-identical lossless WebP runtime logo'
          git push origin HEAD:main
