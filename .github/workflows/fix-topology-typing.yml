name: KForge Topology Typing Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-topology-typing.yml

permissions:
  contents: write

jobs:
  repair:
    name: repair observed traffic discriminant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact TypeScript discriminant repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/services/topologyRuntime.ts')
          s = p.read_text()
          old = '      relationship: "OBSERVED_TRAFFIC",\n'
          new = '      relationship: "OBSERVED_TRAFFIC" as const,\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify TypeScript and audit
        run: |
          npm audit --audit-level=moderate
          npm run typecheck

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "293348050+daynightae-cmyk@users.noreply.github.com"
          git add server/services/topologyRuntime.ts
          git commit -m "fix(preview): narrow observed traffic relationship"
          git push origin HEAD:main
