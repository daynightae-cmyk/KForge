name: KForge Inspector CSS Split

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspector-css-split.yml"

permissions:
  contents: write

jobs:
  split-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded Inspector and CSS ownership refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source fragment missing in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one source fragment in {path}")
              p.write_text(text.replace(old, new, 1))

          wbtsx = Path("client/workbench/KForgeWorkbench.tsx")
          text = wbtsx.read_text()
          text = text.replace(
              'import { useEffect, useMemo, useRef, useState, type ReactNode } from "react";',
              'import { lazy, Suspense, useEffect, useMemo, useRef, useState, type ReactNode } from "react";',
              1,
          )
          text = text.replace(
              'import { WorkbenchSurface, CanonicalInspector } from "./surfaces";',
              'import { WorkbenchSurface } from "./surfaces";',
              1,
          )
          anchor = 'import "./workbench.css";\n'
          if 'lazy(() => import("./CanonicalInspector"))' not in text:
              text = text.replace(anchor, anchor + '\nconst CanonicalInspector = lazy(() => import("./CanonicalInspector"));\n', 1)
          old_render = '{inspectorOpen && <CanonicalInspector activity={activity} view={view} project={activeProject} execution={execution} context={inspectorContext} />}'
          new_render = '{inspectorOpen && <Suspense fallback={<aside className="kw-inspector" aria-label="Context inspector loading" aria-busy="true"><div className="kw-inspector-scroll"><p className="kw-muted" role="status">Loading inspector…</p></div></aside>}><CanonicalInspector activity={activity} view={view} project={activeProject} execution={execution} context={inspectorContext} /></Suspense>}'
          if old_render not in text:
              raise SystemExit("Canonical Inspector render contract not found")
          text = text.replace(old_render, new_render, 1)
          wbtsx.write_text(text)

          global_path = Path("client/global.css")
          global_text = global_path.read_text()
          splash_start = global_text.find("/* Knoux Forge Dark Cinematic Splash")
          splash_end = global_text.find("/* Evidence-first operational surfaces", splash_start)
          if splash_start < 0 or splash_end < 0:
              raise SystemExit("Splash ownership markers not found in global.css")
          splash_css = global_text[splash_start:splash_end].strip() + "\n"
          Path("client/pages/KnouxForgeInstallation.css").write_text(splash_css)
          global_path.write_text('''@tailwind base;
          @tailwind components;
          @tailwind utilities;

          @layer base {
            :root {
              --background: 0 0% 100%;
              --foreground: 222.2 84% 4.9%;
              --card: 0 0% 100%;
              --card-foreground: 222.2 84% 4.9%;
              --popover: 0 0% 100%;
              --popover-foreground: 222.2 84% 4.9%;
              --primary: 173 80% 28%;
              --primary-foreground: 210 40% 98%;
              --secondary: 210 40% 96.1%;
              --secondary-foreground: 222.2 47.4% 11.2%;
              --muted: 210 40% 96.1%;
              --muted-foreground: 215.4 16.3% 46.9%;
              --accent: 210 40% 96.1%;
              --accent-foreground: 222.2 47.4% 11.2%;
              --destructive: 0 84.2% 60.2%;
              --destructive-foreground: 210 40% 98%;
              --border: 214.3 31.8% 91.4%;
              --input: 214.3 31.8% 91.4%;
              --ring: 173 80% 28%;
              --radius: 0.75rem;
            }
            .dark {
              --background: 222.2 84% 4.9%;
              --foreground: 210 40% 98%;
              --card: 222.2 84% 4.9%;
              --card-foreground: 210 40% 98%;
              --popover: 222.2 84% 4.9%;
              --popover-foreground: 210 40% 98%;
              --primary: 172 66% 50%;
              --primary-foreground: 222.2 47.4% 11.2%;
              --secondary: 217.2 32.6% 17.5%;
              --secondary-foreground: 210 40% 98%;
              --muted: 217.2 32.6% 17.5%;
              --muted-foreground: 215 20.2% 65.1%;
              --accent: 217.2 32.6% 17.5%;
              --accent-foreground: 210 40% 98%;
              --destructive: 0 62.8% 30.6%;
              --destructive-foreground: 210 40% 98%;
              --border: 217.2 32.6% 17.5%;
              --input: 217.2 32.6% 17.5%;
              --ring: 172 66% 50%;
            }
            * { @apply border-border; }
            html { direction: ltr; color-scheme: light dark; }
            html[dir="rtl"] { direction: rtl; }
            body {
              @apply bg-background text-foreground font-sans;
              min-width: 320px;
              min-height: 100vh;
              margin: 0;
              overflow: hidden;
              font-family: Inter, "SF Pro Display", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            #root { min-height: 100vh; }
          }
          ''')

          install = Path("client/pages/KnouxForgeInstallation.tsx")
          install_text = install.read_text()
          if 'import "./KnouxForgeInstallation.css";' not in install_text:
              install_text = install_text.replace('import { useNavigate } from "react-router-dom";\n', 'import { useNavigate } from "react-router-dom";\nimport "./KnouxForgeInstallation.css";\n', 1)
          install.write_text(install_text)

          workbench_css_path = Path("client/workbench/workbench.css")
          workbench_css = workbench_css_path.read_text()
          preview_start = workbench_css.find('.kw-workbench-scroll:has(.kw-preview)')
          preview_end = workbench_css.find('/* Shell-owned Preview:', preview_start)
          if preview_start < 0 or preview_end < 0:
              raise SystemExit("Preview CSS ownership markers not found")
          preview_css = workbench_css[preview_start:preview_end].strip() + "\n"
          workbench_css = workbench_css[:preview_start] + workbench_css[preview_end:]
          Path("client/workbench/preview.css").write_text(preview_css)

          online_rules = '''.kw-online-inspector .kw-operation-actions { margin-top: 10px; }
          .kw-online-inspector .kw-operation-actions button { flex: 1 1 auto; }
          '''
          if online_rules not in workbench_css:
              raise SystemExit("Online inspector CSS rules not found")
          workbench_css = workbench_css.replace(online_rules, "", 1)
          cards_start = workbench_css.find('.kw-online-results { display: grid;')
          cards_end = workbench_css.find('.kw-inspector { display:', cards_start)
          if cards_start < 0 or cards_end < 0:
              raise SystemExit("Online card CSS ownership markers not found")
          cards_css = workbench_css[cards_start:cards_end].strip() + "\n"
          workbench_css = workbench_css[:cards_start] + workbench_css[cards_end:]
          layout_rules = '''.kw-online-layout { overflow: hidden; }
          .kw-online-results { overflow: auto; max-height: calc(100vh - 220px); }
          '''
          if layout_rules not in workbench_css:
              raise SystemExit("Online layout CSS rules not found")
          workbench_css = workbench_css.replace(layout_rules, "", 1)
          Path("client/workbench/online.css").write_text(online_rules + cards_css + layout_rules)
          workbench_css_path.write_text(workbench_css)

          for path, import_anchor, css_import in [
              ("client/workbench/onlineSurface.tsx", None, 'import "./online.css";\n'),
              ("client/workbench/PreviewStudioWorkbench.tsx", None, 'import "./preview.css";\n'),
          ]:
              p = Path(path)
              t = p.read_text()
              if css_import.strip() not in t:
                  t = css_import + t
              p.write_text(t)

          Path("client/workbench/inspectorCodeSplitting.spec.ts").write_text('''import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const read = (name: string) => readFileSync(new URL(name, import.meta.url), "utf8");

          describe("Canonical Inspector code splitting", () => {
            it("keeps the canonical inspector outside the Workbench core and nests specialized inspectors", () => {
              const workbench = read("./KForgeWorkbench.tsx");
              const surfaces = read("./surfaces.tsx");
              const inspector = read("./CanonicalInspector.tsx");
              expect(workbench).toContain('lazy(() => import("./CanonicalInspector"))');
              expect(workbench).toContain("<Suspense fallback=");
              expect(surfaces).not.toContain("CanonicalInspector");
              expect(surfaces).not.toContain("KForgeInspector");
              expect(inspector).toContain('import("@/components/ui/KForgeInspector")');
              expect(inspector).toContain('import("./PreviewRuntimeInspector")');
            });
          });
          ''')

          Path("client/workbench/cssOwnership.spec.ts").write_text('''import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const root = (path: string) => readFileSync(new URL(`../../${path}`, import.meta.url), "utf8");

          describe("KForge CSS ownership", () => {
            it("keeps global CSS minimal and route/activity CSS owned by its surface", () => {
              const global = root("client/global.css");
              const splash = root("client/pages/KnouxForgeInstallation.css");
              const workbench = root("client/workbench/workbench.css");
              const online = root("client/workbench/online.css");
              const preview = root("client/workbench/preview.css");
              expect(global).not.toContain("Knoux Edita PRO");
              expect(global).not.toContain(".knoux-");
              expect(global).not.toContain(".kf-app");
              expect(global).not.toContain(".kf-splash");
              expect(global).not.toContain("fonts.googleapis.com");
              expect(splash).toContain(".kf-splash");
              expect(workbench).not.toContain(".kw-capability-card");
              expect(online).toContain(".kw-capability-card");
              expect(workbench).not.toContain(".kw-workbench-scroll:has(.kw-preview)");
              expect(preview).toContain(".kw-workbench-scroll:has(.kw-preview)");
            });
          });
          ''')

          Path("tests/e2e/inspector-css-code-splitting.spec.ts").write_text('''import { expect, test } from "@playwright/test";
          import { openWorkbench, selectExplorerView } from "./helpers/workbench";

          test("defers specialized Inspector JS and Activity CSS until the owning surface needs them", async ({ page }) => {
            expect((await page.request.post("/api/workspace/settings/reset", { data: { confirmed: true } })).ok()).toBeTruthy();
            const assets: string[] = [];
            page.on("request", (request) => {
              const url = new URL(request.url());
              if (url.pathname.includes("/assets/")) assets.push(url.pathname);
            });

            await openWorkbench(page);
            await expect(page.locator(".kw-inspector")).toBeVisible();
            expect(assets.some((path) => /CanonicalInspector-.*\\.js$/.test(path))).toBeTruthy();
            expect(assets.some((path) => /KForgeInspector-.*\\.js$/.test(path))).toBeFalsy();
            expect(assets.some((path) => /PreviewRuntimeInspector-.*\\.js$/.test(path))).toBeFalsy();
            expect(assets.some((path) => /onlineSurface-.*\\.css$/.test(path))).toBeFalsy();
            expect(assets.some((path) => /PreviewStudioWorkbench-.*\\.css$/.test(path))).toBeFalsy();

            await selectExplorerView(page, "Online", "Extensions");
            await expect(page.locator('.kw-capability-card[data-item-id="package:kforge:json-inspector"]')).toBeVisible();
            expect(assets.some((path) => /onlineSurface-.*\\.css$/.test(path))).toBeTruthy();
            expect(assets.some((path) => /KForgeInspector-.*\\.js$/.test(path))).toBeFalsy();

            await page.locator('.kw-capability-card[data-item-id="package:kforge:json-inspector"]').click();
            await expect(page.locator(".kw-inspector")).toContainText("kforge-json-inspector");
            expect(assets.some((path) => /KForgeInspector-.*\\.js$/.test(path))).toBeTruthy();
            expect(assets.some((path) => /PreviewRuntimeInspector-.*\\.js$/.test(path))).toBeFalsy();
          });
          ''')
          PY
      - name: Verify refactor before commit
        shell: bash
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run lint
          npm test
          npm run build
          git diff --check
          test "$(git status --porcelain | wc -l)" -gt 0
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "293348050+daynightae-cmyk@users.noreply.github.com"
          git add client tests/e2e/inspector-css-code-splitting.spec.ts
          git commit -m "perf(workbench): isolate inspectors and route-owned css"
          git push origin HEAD:main
