name: KForge Router Audit Remediation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-router-audit.yml

permissions:
  contents: write

concurrency:
  group: kforge-router-audit-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: update audited router dependency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Upgrade React Router to audited fixed release
        run: npm install --package-lock-only --ignore-scripts --save-exact react-router-dom@7.18.3

      - name: Require zero moderate-or-higher npm advisories
        run: npm audit --audit-level=moderate

      - name: Remove one-shot remediation workflow
        run: rm -f .github/workflows/fix-router-audit.yml

      - name: Commit dependency remediation
        shell: bash
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "293348050+daynightae-cmyk@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/fix-router-audit.yml
          git commit -m "fix(deps): remediate react-router audit advisories"
          git push origin HEAD:main
