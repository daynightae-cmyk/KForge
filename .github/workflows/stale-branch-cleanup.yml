name: One-shot stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stale-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: delete verified merged stale branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify stale branch identity and ancestry, then delete it
        shell: bash
        run: |
          set -euo pipefail
          branch='wip/codex-workbench-handoff'
          expected='d527b460533a51994a1518cfb40f4bc59683b185'
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          actual="$(git rev-parse "refs/remotes/origin/${branch}")"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing cleanup: ${branch} moved from expected ${expected} to ${actual}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual" HEAD; then
            echo "Refusing cleanup: ${branch} is not an ancestor of current main."
            exit 1
          fi
          git push origin --delete "$branch"
