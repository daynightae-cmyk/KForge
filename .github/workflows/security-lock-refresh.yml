name: KForge Security Lock Refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Refresh audited lockfile
        run: npm audit fix --package-lock-only
      - name: Prove audit is clean
        run: npm audit
      - name: Commit lockfile only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git add package-lock.json
          git commit -m "fix(security): refresh audited transitive dependencies"
          git push origin HEAD:main
