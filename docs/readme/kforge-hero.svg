<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">KNOuX Forge — Engineering is not a luxury, it is a life</title>
<desc id="desc">Pearlescent luxury-glass KNOuX Forge banner with precise typography, lilac glass panes, orbital engineering mark, and local-first engineering command center message.</desc>
<defs>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f0ff"/><stop offset=".46" stop-color="#fdfcff"/><stop offset="1" stop-color="#e5daf9"/></linearGradient>
