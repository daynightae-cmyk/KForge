<text x="83" y="234" font-family="Segoe UI,Arial,sans-serif" font-weight="600" font-size="27" fill="#54436c">The engineering command center.</text>
<text x="82" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#685779">Discover. Understand. Build. Verify. Ship.</text>
